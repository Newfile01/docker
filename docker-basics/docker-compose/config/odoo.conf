
[options]

; ==========================================
; CONNEXION POSTGRESQL
; ==========================================

db_host = db
db_port = 5432
db_user = odoo
db_password = False

; ==========================================
; MODULES
; ==========================================

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ==========================================
; SERVEUR HTTP
; ==========================================

http_interface = 0.0.0.0
http_port = 8069
proxy_mode = False

; ==========================================
; SECURITE
; ==========================================

admin_passwd = CHANGE_ME_MASTER_PASSWORD
list_db = True

; ==========================================
; JOURNAUX
; ==========================================

log_level = info
logfile = /var/log/odoo/odoo.log

; ==========================================
; PERFORMANCES
; ==========================================

workers = 0
max_cron_threads = 2

# db_host = db	Nom du service PostgreSQL dans le réseau Docker Compose
# db_port = 5432	Port PostgreSQL interne
# db_user = odoo	Utilisateur PostgreSQL
# db_password = False	Pas de mot de passe défini dans le fichier de configuration
# addons_path	Emplacement des modules Odoo
# http_interface	Interface d'écoute HTTP
# http_port	Port HTTP d'Odoo
# proxy_mode	Active la prise en compte des en-têtes d'un reverse proxy
# admin_passwd	Mot de passe maître pour les opérations d'administration des bases
# list_db	Autorise l'affichage de la liste des bases
# log_level	Niveau de journalisation
# workers	Nombre de processus workers
# max_cron_threads	Nombre de threads dédiés aux tâches planifiées